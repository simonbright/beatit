<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — BeatIt</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("beatit-theme") || "day");
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.75rem 1.75rem;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .login-duck {
      width: 72px;
      height: 72px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.3);
    }

    .login-brand h1 {
      margin: 0 0 0.35rem;
      font-size: 1.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .login-brand p {
      margin: 0;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 0;
      text-align: left;
    }

    .login-form label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin: 0 0 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .login-form input[type="text"],
    .login-form input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid rgba(14, 116, 144, 0.4);
      background: var(--surface-2);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .login-form input[type="text"]:focus,
    .login-form input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-solid);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.22);
    }

    [data-theme="night"] .login-form input[type="text"],
    [data-theme="night"] .login-form input[type="password"] {
      border-color: rgba(125, 211, 252, 0.45);
      background: rgba(8, 32, 50, 0.65);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    [data-theme="night"] .login-form input[type="text"]:focus,
    [data-theme="night"] .login-form input[type="password"]:focus {
      border-color: var(--accent);
      background: var(--surface-solid);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .login-remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 0.25rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .login-remember input {
      width: 1rem;
      height: 1rem;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .login-form .btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
    }

    .login-error {
      margin: 0.75rem 0 0;
      color: var(--danger);
      font-size: 0.9rem;
      min-height: 1.25rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <div class="page-bg-sky"></div>
    <div class="page-bg-hills"></div>
    <div class="page-bg-water"></div>
  </div>

  <div class="login-wrap">
    <article class="card login-card">
      <div class="login-brand">
        <img src="/static/favicon.svg" alt="" class="login-duck" width="72" height="72">
        <h1>BeatIt</h1>
        <p class="muted">Sign in to continue</p>
      </div>

      <form id="login-form" class="login-form" method="post" action="/api/login" autocomplete="on">
        <label for="login-username">Email / username
          <input
            type="text"
            id="login-username"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required
          >
        </label>
        <label for="login-password">Password
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            required
          >
        </label>
        <label class="login-remember" for="login-remember">
          <input type="checkbox" id="login-remember" name="remember">
          Remember me on this device
        </label>
        <button type="submit" class="btn primary">Sign in</button>
      </form>
      <p id="login-error" class="login-error" role="alert"></p>
    </article>
  </div>

  <footer class="app-footer" aria-label="App version">
    <p class="app-footer-text" id="app-version">BeatIt</p>
  </footer>

  <script>
    const REMEMBER_KEY = "beatit-login-remember";
    const USERNAME_KEY = "beatit-login-username";

    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("login-username");
    const passwordInput = document.getElementById("login-password");
    const rememberInput = document.getElementById("login-remember");
    const errEl = document.getElementById("login-error");

    if (localStorage.getItem(REMEMBER_KEY) === "1") {
      rememberInput.checked = true;
      const saved = localStorage.getItem(USERNAME_KEY);
      if (saved) usernameInput.value = saved;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Sign in failed");

        if (rememberInput.checked) {
          localStorage.setItem(REMEMBER_KEY, "1");
          localStorage.setItem(USERNAME_KEY, username);
        } else {
          localStorage.removeItem(REMEMBER_KEY);
          localStorage.removeItem(USERNAME_KEY);
        }

        window.location.href = "/";
      } catch (ex) {
        errEl.textContent = ex.message || "Sign in failed";
        passwordInput.focus();
        passwordInput.select();
      }
    });
  </script>
  <script>
    fetch("/api/version")
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data?.version) return;
        const el = document.getElementById("app-version");
        if (!el) return;
        const updated = data.updated
          ? new Date(`${data.updated}T12:00:00`).toLocaleDateString(undefined, {
              year: "numeric",
              month: "short",
              day: "numeric",
            })
          : "";
        el.textContent = `${data.name || "BeatIt"} v${data.version}${updated ? ` · updated ${updated}` : ""}`;
      })
      .catch(() => {});
  </script>
</body>
</html>
