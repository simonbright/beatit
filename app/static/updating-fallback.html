<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updating — Bright Health</title>
  <meta name="theme-color" content="#0ea5e9">
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      --text: #1e3a4f;
      --muted: #5b7289;
      --accent: #0ea5e9;
      --accent-text: #ffffff;
      --surface: rgba(255, 255, 255, 0.92);
      --border: rgba(251, 191, 36, 0.28);
      --shadow: 0 16px 48px rgba(14, 116, 144, 0.16);
      font-family: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, #bae6fd 0%, transparent 55%),
        linear-gradient(180deg, #e0f2fe 0%, #fff8ed 55%, #fef3c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 2rem 1.75rem 1.75rem;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.1rem;
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(14, 165, 233, 0.35);
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 {
      margin: 0 0 0.65rem;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1rem;
    }
    .countdown {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--text);
    }
    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 700;
      padding: 0.8rem 1.4rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.28);
    }
    .btn:hover { filter: brightness(1.05); }
    .hint {
      margin: 1rem 0 0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bright Health">
      <circle cx="32" cy="32" r="30" fill="#38bdf8"/>
      <circle cx="32" cy="28" r="24" fill="#7dd3fc"/>
      <ellipse cx="32" cy="40" rx="18" ry="12" fill="#facc15"/>
      <circle cx="32" cy="24" r="13" fill="#fde047"/>
      <circle cx="38" cy="22" r="2.2" fill="#1e293b"/>
      <path d="M44 24c4 2 5 5 3 7-2-1-4-2-6-2 1-3 2-4 3-5z" fill="#fb923c"/>
      <ellipse cx="26" cy="44" rx="7" ry="3" fill="#fbbf24" opacity="0.85"/>
    </svg>
    <h1>Bright Health is updating</h1>
    <p>
      We’re rolling out a fresh version. This page will refresh in
      <span class="countdown" id="countdown">60</span> seconds —
      or tap Refresh anytime.
    </p>
    <button type="button" class="btn" id="btn-refresh">Refresh now</button>
    <p class="hint">Thanks for waiting — you’re all set once this finishes.</p>
  </main>
  <script>
    (function () {
      var left = 60;
      var el = document.getElementById("countdown");
      var btn = document.getElementById("btn-refresh");
      function refresh() { window.location.replace("/"); }
      btn.addEventListener("click", refresh);
      var tick = setInterval(function () {
        left -= 1;
        if (el) el.textContent = String(Math.max(0, left));
        if (left <= 0) {
          clearInterval(tick);
          refresh();
        }
      }, 1000);
      function probe() {
        fetch("/api/version", { credentials: "include", cache: "no-store" })
          .then(function (r) { if (r.ok) refresh(); })
          .catch(function () {});
      }
      setInterval(probe, 4000);
      setTimeout(probe, 1500);
    })();
  </script>
</body>
</html>
